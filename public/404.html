<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Doggiepedia</title>
    <!--
      GitHub Pages serves this file for any path it does not recognise. Because
      Doggiepedia is a single-page app, a deep link like /doggiepedia/about never
      exists as a file. This script encodes the requested path into a query string
      and bounces back to the app root, where the decoder in index.html restores it.
      See https://github.com/rafgraph/spa-github-pages

      pathSegmentsToKeep is 1: the first segment is the repo name (/doggiepedia)
      and has to survive the round-trip.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
